<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link rel="stylesheet" href="./styles/shared.css" />
    <link rel="stylesheet" href="./styles/index.css" />
    <link rel="icon" href="./assets/icons/logo.png" type="image/x-icon" />
  </head>
  <body class="flex f-d-c j-c-c a-i-c m-h-100vh">
    <main class="flex f-d-c j-c-c a-i-c">
      <h1 class="title">Login</h1>
      <section class="flex f-d-c a-i-c j-c-s-e box mt-20">
        <input type="text" class="input" placeholder="Enter your username" />
        <input
          type="password"
          class="input"
          placeholder="Enter your password"
        />
        <button class="button">Login</button>
        <a href="./sign_up.html" class="a-s-e"
          >Don't have an account? Create account</a
        >
        <h4 class="mt-5"></h4>
      </section>
    </main>
    <script src="./scripts/utils/constants.js"></script>
    <script src="./scripts/index.js"></script>
  </body>
</html>
